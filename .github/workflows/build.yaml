name: Build and container checks

on:
  workflow_call:
    inputs:
      full:
        description: Run container integration and runtime qualification after smoke
        type: boolean
        default: false
      runtime-run-id:
        description: Trusted run whose smoke-tested binary is reused for qualification
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    if: inputs.runtime-run-id == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          workload: runtime

      - name: Validate artifact and release versions
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(go run ./scripts/release -tag "${RELEASE_TAG:-v$(cat VERSION)}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Load pinned Go runner (source only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: heos-control:runner

      - name: Compile runtime once in Docker
        id: compile
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p "$GOCACHE" "$GOMODCACHE" bin
          docker run --rm --user "$(id -u):$(id -g)" \
            --env GOCACHE=/cache/build --env GOMODCACHE=/cache/mod --env GOTOOLCHAIN=local \
            --env CGO_ENABLED=0 --env GOOS=linux --env GOARCH=amd64 \
            --mount "type=bind,src=$GOCACHE,dst=/cache/build" \
            --mount "type=bind,src=$GOMODCACHE,dst=/cache/mod" \
            --mount "type=bind,src=$PWD/bin,dst=/out" \
            heos-control:runner go build -trimpath \
            -ldflags="-s -w -X main.version=$VERSION -X main.commit=$COMMIT" \
            -o /out/heos-control ./cmd/heos-control

      - name: Build runtime image for smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: runtime-prebuilt
          build-contexts: runtime-binaries=./bin
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: heos-control:dev
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Create disposable TLS credentials and database configs
        run: go run ./scripts/devsetup

      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Smoke-test the compiled runtime
        run: |
          test -x bin/heos-control
          bash scripts/smoke.sh

      - name: Retain smoke-tested runtime binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtime-binary
          path: bin/heos-control
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Report disk usage
        if: always()
        run: |
          df -h /
          docker system df

      - name: Cleanup disposable environment
        if: always()
        run: docker compose --profile app --profile tools --profile tests down -v

      - name: Save downloaded modules after successful checks
        if: ${{ success() && steps.go-cache.outputs.module-key != '' && steps.go-cache.outputs.module-hit
          != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ steps.go-cache.outputs.module-key }}
          path: ${{ env.GOMODCACHE }}

      - name: Save compiled packages even after failed checks
        if: ${{ !cancelled() && steps.go-cache.outputs.build-key != '' && steps.go-cache.outputs.build-hit
          != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ steps.go-cache.outputs.build-key }}
          path: ${{ env.GOCACHE }}
  container-tests:
    needs: runtime
    if: >-
      ${{ !cancelled() && inputs.full && (needs.runtime.result == 'success' || inputs.runtime-run-id !=
      '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          workload: container-tests

      - name: Validate artifact and release versions
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(go run ./scripts/release -tag "${RELEASE_TAG:-v$(cat VERSION)}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Load pinned Go runner (source only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: heos-control:runner

      - name: Compile race-enabled integration binary in Docker
        id: compile
        run: |
          mkdir -p "$GOCACHE" "$GOMODCACHE" bin/integration
          docker run --rm --user "$(id -u):$(id -g)" \
            --env GOCACHE=/cache/build --env GOMODCACHE=/cache/mod --env GOTOOLCHAIN=local \
            --mount "type=bind,src=$GOCACHE,dst=/cache/build" \
            --mount "type=bind,src=$GOMODCACHE,dst=/cache/mod" \
            --mount "type=bind,src=$PWD/bin/integration,dst=/out" \
            heos-control:runner go test -race -tags=integration -c -o /out/journal.test ./internal/journal

      - name: Package integration test binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: integration-prebuilt
          build-contexts: integration-binaries=./bin/integration
          load: true
          push: false
          tags: heos-control:test

      - name: Create disposable TLS credentials and database configs
        run: go run ./scripts/devsetup

      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run container integration
        run: |
          docker image inspect heos-control:test >/dev/null
          docker compose --profile tests run --rm --pull never integration -test.v -test.count=1 -test.timeout=5m

      - name: Download the smoke-tested binary for qualification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: runtime-binary
          path: bin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.runtime-run-id || github.run_id }}

      - name: Verify the downloaded binary version and commit
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          chmod +x bin/heos-control
          bin/heos-control version | jq -e --arg version "$EXPECTED_VERSION" --arg commit "$GITHUB_SHA" '.version == $version and .commit == $commit'

      - name: Test runtime resources, crash recovery and PostgreSQL backup restoration
        run: go run ./scripts/qualify

      - name: Report disk usage
        if: always()
        run: |
          df -h /
          docker system df

      - name: Cleanup disposable environment
        if: always()
        run: docker compose --profile app --profile tools --profile tests down -v

      - name: Save downloaded modules after successful checks
        if: ${{ success() && steps.go-cache.outputs.module-key != '' && steps.go-cache.outputs.module-hit
          != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ steps.go-cache.outputs.module-key }}
          path: ${{ env.GOMODCACHE }}

      - name: Save compiled packages even after failed checks
        if: ${{ !cancelled() && steps.go-cache.outputs.build-key != '' && steps.go-cache.outputs.build-hit
          != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ steps.go-cache.outputs.build-key }}
          path: ${{ env.GOCACHE }}
