name: heos-control-dev
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint: [bash, -ec]
    command:
      - |
        cp /run/secrets/server.key /tmp/server.key
        chown postgres:postgres /tmp/server.key
        chmod 0600 /tmp/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/run/secrets/server.crt -c ssl_key_file=/tmp/server.key
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-heos.sh:ro
    secrets: [admin-password, owner-password, runtime-password, server.crt, server.key]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  heos-control:
    profiles: [app]
    image: heos-control:dev
    build:
      context: .
      target: runtime
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    ports: ["127.0.0.1:8443:8443"]
    command: [serve, -config, /run/secrets/runtime-config]
    secrets: [runtime-config, runtime-password, ca.crt, server.crt, server.key, api-credentials]
  migrate:
    profiles: [tools]
    image: heos-control:dev
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [migrate, -config, /run/secrets/owner-config]
    secrets: [owner-config, owner-password, ca.crt]
  integration:
    profiles: [tests]
    image: heos-control:test
    build:
      context: .
      target: test
    environment:
      HEOS_TEST_OWNER_CONFIG: /run/secrets/test-owner-config
      HEOS_TEST_RUNTIME_CONFIG: /run/secrets/test-runtime-config
    command: ["-test.count=1", "-test.timeout=5m"]
    secrets: [test-owner-config, test-runtime-config, owner-password, runtime-password, ca.crt, server.crt, server.key]
volumes:
  postgres-data:
secrets:
  api-credentials:
    file: .local/credentials.json
  admin-password:
    file: .local/admin-password
  owner-password:
    file: .local/owner-password
  runtime-password:
    file: .local/runtime-password
  ca.crt:
    file: .local/ca.crt
  server.crt:
    file: .local/server.crt
  server.key:
    file: .local/server.key
  owner-config:
    file: .local/container-owner.json
  runtime-config:
    file: .local/container-runtime.json
  test-owner-config:
    file: .local/container-test-owner.json
  test-runtime-config:
    file: .local/container-test-runtime.json
